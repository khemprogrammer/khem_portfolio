services:
  - type: web
    name: khem-portfolio
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate
    startCommand: gunicorn portfolio_project.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GITHUB_USERNAME
        value: "khemprogrammer"
    disk:
      name: media
      mountPath: /opt/render/project/src/media
      sizeGB: 1